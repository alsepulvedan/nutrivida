<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVida - Registro de Usuario</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO (Mismo que el HOME) -->
    <header>
        <div class="top-bar">
            <div class="logo">
                <h1>NutriVida</h1>
            </div>
            
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <div class="cart">
                <a href="carrito.html">🛒 Cart (0)</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: FORMULARIO DE REGISTRO -->
    <main>
        <section class="form-container">
            <h2>Registro de usuario</h2>
            
            <form id="form-registro">
                
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="form-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" name="correo">
                </div>

                <div class="form-group">
                    <label for="correo-confirm">CONFIRMAR CORREO</label>
                    <input type="email" id="correo-confirm" name="correo-confirm">
                </div>

                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="password-confirm">CONFIRMAR CONTRASEÑA</label>
                    <input type="password" id="password-confirm" name="password-confirm">
                </div>

                <div class="form-group">
                    <label for="telefono">TELÉFONO (opcional)</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <!-- Selectores de Región y Comuna según la pauta -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="region">Región</label>
                        <select id="region" name="region">
                            <option value="">-- Seleccione la región --</option>
                            <option value="rm">Región Metropolitana de Santiago</option>
                            <option value="araucania">Región de la Araucanía</option>
                            <option value="nuble">Región de Ñuble</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comuna">Comuna</label>
                        <select id="comuna" name="comuna">
                            <option value="">-- Seleccione la comuna --</option>
                            <option value="linares">Linares</option>
                            <option value="longavi">Longaví</option>
                            <option value="concepcion">Concepción</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">REGISTRAR</button>
                </div>

            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA (Mismo que el HOME) -->
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <p>Site Name</p>
            </div>

            <div class="footer-categories">
                <a href="#">Category X</a> | 
                <a href="#">Category Y</a> | 
                <a href="#">Category Z</a>
            </div>

            <div class="footer-newsletter">
                <p>Stay In Touch! Join our Newsletter</p>
                <form>
                    <input type="email" placeholder="Enter Email">
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>
