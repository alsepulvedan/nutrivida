<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVida - Iniciar Sesión</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <div class="top-bar">
            <div class="logo">
                <h1>NutriVida</h1>
            </div>
            
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <div class="cart">
                <a href="carrito.html">🛒 Cart (0)</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: FORMULARIO DE LOGIN -->
    <main>
        <section class="form-container">
            <h2>Iniciar sesión</h2>
            
            <form id="form-login">
                
                <div class="form-group">
                    <label for="login-correo">CORREO ELECTRÓNICO</label>
                    <input type="email" id="login-correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="login-password">CONTRASEÑA</label>
                    <input type="password" id="login-password" name="password" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">INGRESAR</button>
                </div>

            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <p>Site Name</p>
            </div>

            <div class="footer-categories">
                <a href="#">Category X</a> | 
                <a href="#">Category Y</a> | 
                <a href="#">Category Z</a>
            </div>

            <div class="footer-newsletter">
                <p>Stay In Touch! Join our Newsletter</p>
                <form>
                    <input type="email" placeholder="Enter Email">
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>
