<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVida contacto</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <div class="top-bar">
            <div class="logo">
                <h1>NutriVida</h1>
            </div>
            
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <!--<li><a href="nosotros.html">Nosotros</a></li>-->
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>

            <div class="cart">
                <a href="carrito.html">🛒 Carrito (0)</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL: FORMULARIO DE CONTACTO -->
    <main>
        <section class="form-container">
            <h2>FORMULARIO DE CONTACTOS</h2>
            
            <form id="form-contacto">
                <div class="form-group">
                    <label for="contacto-nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="contacto-nombre" name="nombre" required>
                    
                </div>
                <div class="form-group">
                    <label for="contacto-correo">CORREO</label>
                    <input type="email" id="contacto-correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="contacto-contenido">CONTENIDO</label>
                   <textarea id="contacto-contenido" name="contenido" rows="4" cols="50" required ></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">ENVIAR MENSAJE </button>
                </div>

            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <p>Clínica Nutricional NutriVida</p>
            </div>

            <div class="footer-categories">
                <a href="productos.html">Recuperación</a> | 
                <a href="productos.html">Rendimiento</a> | 
                <a href="productos.html">Salud</a>
            </div>

            <div class="footer-newsletter">
                <p>Mantente en Contacto! Recibe nuestras Ultimas Noticia</p>
                <form>
                    <input type="email" placeholder="Ingresar Email">
                    <button type="submit">Subscribirse</button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>
